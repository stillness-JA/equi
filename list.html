<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已借出設備清單</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
            margin: 0;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .action-btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-home {
            background-color: #6c757d;
            color: white;
        }
        .btn-home:hover {
            background-color: #5a6268;
        }
        .btn-refresh {
            background-color: #007bff;
            color: white;
        }
        .btn-refresh:hover {
            background-color: #0056b3;
        }
        .table-container {
            max-width: 900px;
            margin: 0 auto;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .status-badge {
            background-color: #ffc107;
            color: #212529;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        #msg {
            text-align: center;
            font-size: 16px;
            margin: 25px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>📋 目前已借出設備清單</h2>

    <div class="btn-group">
        <!-- 點擊回到掃描首頁 -->
        <a href="index.html" class="action-btn btn-home">⬅ 回到首頁</a>
        <!-- 點擊重新載入 API 資料 -->
        <button class="action-btn btn-refresh" onclick="fetchList()">🔄 重新整理</button>
    </div>

    <div id="msg">載入中，請稍候...</div>

    <div class="table-container" id="container" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th>編號</th>
                    <th>廠牌</th>
                    <th>設備名稱</th>
                    <th>借出狀態</th>
                    <th>借出/更新時間</th>
                </tr>
            </thead>
            <tbody id="list-body"></tbody>
        </table>
    </div>

    <script>
        // ★★★ 請替換成您的 GAS 網頁應用程式 URL ★★★
        const API_URL = "https://script.google.com/macros/s/AKfycbzmBXl82KlfLR3GBtRhKv8GQ8b7BEOcDs-C1ywubNC5yYIlQcb0UYOFg2fEmSBxZt4/exec";

        function fetchList() {
            const msg = document.getElementById('msg');
            const container = document.getElementById('container');
            const tbody = document.getElementById('list-body');

            msg.style.display = 'block';
            msg.innerText = '讀取最新資料中...';
            container.style.display = 'none';

            fetch(`${API_URL}?action=list_borrowed`)
                .then(res => res.json())
                .then(res => {
                    if (res.success && res.data) {
                        if (res.data.length === 0) {
                            msg.innerText = '🎉 目前沒有任何設備處於借出狀態！';
                            return;
                        }

                        tbody.innerHTML = '';
                        res.data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${item.id || '-'}</td>
                                <td>${item.brand || '-'}</td>
                                <td>${item.name || '-'}</td>
                                <td><span class="status-badge">${item.status}</span></td>
                                <td>${item.updatedTime || '無紀錄'}</td>
                            `;
                            tbody.appendChild(tr);
                        });

                        msg.style.display = 'none';
                        container.style.display = 'block';
                    } else {
                        msg.innerText = '讀取失敗：' + (res.message || '未知錯誤');
                    }
                })
                .catch(err => {
                    msg.innerText = '網路或連線錯誤，無法載入清單。';
                });
        }

        // 頁面載入完成後自動抓取一次清單
        window.addEventListener('DOMContentLoaded', fetchList);
    </script>
</body>
</html>
